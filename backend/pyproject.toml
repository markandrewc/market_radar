[project]
name = "market-radar-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.11.20",
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pgserver>=0.1.4",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
