# Curated IT skills for "who is hiring" (Level 3, category C; docs/api.md).
#
# Not an ESCO classification: a short, hand-checked list of the tools and topics that
# actually appear in Swiss web-development, IT-support, data-analysis, cloud/DevOps
# and UX postings. `name` is the canonical spelling the API returns in `topSkills`;
# every `aliases` entry is matched case-insensitively on word boundaries against a
# posting's title and description. Order does not matter.
#
# Add a skill by adding one block; no code change is needed.
